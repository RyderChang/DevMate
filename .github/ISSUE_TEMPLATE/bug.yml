name: 缺陷报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: 提交前请删除日志、截图中的密钥、Token、个人信息和私有代码。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要说明问题及发生频率。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 按顺序列出稳定复现问题的操作。
      placeholder: |
        1. 打开……
        2. 执行……
        3. 观察……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 说明正确情况下应该发生什么。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 说明实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 提供版本、操作系统、浏览器或相关运行环境信息，不要提供凭据。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 提供已脱敏的日志或截图；没有时填写“无”。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 说明受影响的用户、模块和严重程度。
    validations:
      required: true
