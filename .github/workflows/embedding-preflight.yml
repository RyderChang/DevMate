name: Embedding Preflight

on:
  pull_request:
    branches: [develop, feature/dev-020-document-vector-indexing]
    paths:
      - scripts/embedding-preflight/**
      - scripts/embedding-service/**
      - .github/workflows/embedding-preflight.yml
  push:
    branches: [develop]
    paths:
      - scripts/embedding-preflight/**
      - scripts/embedding-service/**
      - .github/workflows/embedding-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedding-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  embedding-preflight:
    name: Embedding and Vector Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create isolated tokenizer environment
        run: |
          python3 --version
          python3 -m venv tmp/dev-019/ci
          tmp/dev-019/ci/bin/python -m pip install --no-deps --require-hashes -r scripts/embedding-preflight/requirements-tokenizer.txt
      - name: Verify tokenizer, cache recovery and loopback HTTP contracts
        run: |
          tmp/dev-019/ci/bin/python -B scripts/embedding-preflight/test_offline.py
          tmp/dev-019/ci/bin/python -B scripts/embedding-preflight/test_download_cache.py
          tmp/dev-019/ci/bin/python -B scripts/embedding-preflight/test_http.py
          tmp/dev-019/ci/bin/python -B scripts/embedding-service/test_service.py
      - name: Pull locked isolated database images
        run: python3 -B scripts/embedding-preflight/pull_images.py
      - name: Verify real Qdrant and MySQL contracts
        run: python3 -B scripts/embedding-preflight/test_vector.py
