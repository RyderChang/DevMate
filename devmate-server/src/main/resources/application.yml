spring:
  application:
    name: devmate-server
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO

devmate:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT2H}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:openai}
    connect-timeout: ${AI_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${AI_READ_TIMEOUT:PT60S}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1024}
    max-message-characters: ${AI_MAX_MESSAGE_CHARACTERS:8000}
    max-context-messages: ${AI_MAX_CONTEXT_MESSAGES:20}
    max-context-characters: ${AI_MAX_CONTEXT_CHARACTERS:24000}
    generation-lease: ${AI_GENERATION_LEASE:PT2M}
    max-response-bytes: ${AI_MAX_RESPONSE_BYTES:1048576}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
