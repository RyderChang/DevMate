spring:
  application:
    name: devmate-server
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO

devmate:
  knowledge:
    indexing:
      enabled: ${KNOWLEDGE_INDEXING_ENABLED:false}
      scheduling-enabled: ${KNOWLEDGE_INDEXING_SCHEDULING_ENABLED:true}
      model-origin: ${EMBEDDING_LOCAL_ORIGIN:http://127.0.0.1:8091}
      vector-origin: ${QDRANT_LOCAL_ORIGIN:http://127.0.0.1:6333}
      collection: ${QDRANT_INDEX_COLLECTION:devmate_qwen3_v1}
    retrieval:
      enabled: ${KNOWLEDGE_RETRIEVAL_ENABLED:false}
      scheduling-enabled: ${KNOWLEDGE_RETRIEVAL_SCHEDULING_ENABLED:true}
    processing:
      enabled: ${KNOWLEDGE_PROCESSING_ENABLED:false}
      scheduling-enabled: ${KNOWLEDGE_PROCESSING_SCHEDULING_ENABLED:true}
    enabled: ${KNOWLEDGE_ENABLED:false}
    allow-local-http: ${KNOWLEDGE_ALLOW_LOCAL_HTTP:false}
    endpoint: ${KNOWLEDGE_ENDPOINT:}
    region: ${KNOWLEDGE_REGION:us-east-1}
    bucket: ${KNOWLEDGE_BUCKET:}
    access-key: ${KNOWLEDGE_ACCESS_KEY:}
    secret-key: ${KNOWLEDGE_SECRET_KEY:}
    max-file-bytes: ${KNOWLEDGE_MAX_FILE_BYTES:5242880}
    max-request-bytes: ${KNOWLEDGE_MAX_REQUEST_BYTES:6291456}
    max-documents: ${KNOWLEDGE_MAX_DOCUMENTS:100}
    max-project-bytes: ${KNOWLEDGE_MAX_PROJECT_BYTES:104857600}
    temp-max-bytes: ${KNOWLEDGE_TEMP_MAX_BYTES:268435456}
    temp-directory: ${KNOWLEDGE_TEMP_DIRECTORY:${java.io.tmpdir}/devmate-knowledge}
    max-concurrent-uploads: ${KNOWLEDGE_MAX_CONCURRENT_UPLOADS:4}
    connect-timeout: ${KNOWLEDGE_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${KNOWLEDGE_READ_TIMEOUT:PT10S}
    operation-timeout: ${KNOWLEDGE_OPERATION_TIMEOUT:PT30S}
    operation-lease: ${KNOWLEDGE_OPERATION_LEASE:PT2M}
    scan-interval: ${KNOWLEDGE_SCAN_INTERVAL:PT60S}
    scan-batch-size: ${KNOWLEDGE_SCAN_BATCH_SIZE:50}
    max-automatic-retries: ${KNOWLEDGE_MAX_AUTOMATIC_RETRIES:5}
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT2H}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:openai}
    connect-timeout: ${AI_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${AI_READ_TIMEOUT:PT60S}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1024}
    max-message-characters: ${AI_MAX_MESSAGE_CHARACTERS:8000}
    max-context-messages: ${AI_MAX_CONTEXT_MESSAGES:20}
    max-context-characters: ${AI_MAX_CONTEXT_CHARACTERS:24000}
    generation-lease: ${AI_GENERATION_LEASE:PT2M}
    max-response-bytes: ${AI_MAX_RESPONSE_BYTES:1048576}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:}
